<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anclox Launcher - Anime Games</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="launcher-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-gamepad"></i>
                <span>Anclox</span>
            </div>
            <nav class="menu">
                <ul>
                    <li class="active"><a href="#" data-tab="home"><i class="fa-solid fa-house"></i> Home</a></li>
                    <li><a href="#" data-tab="library"><i class="fa-solid fa-book-journal-whills"></i> Biblioteka</a></li>
                    <li><a href="#" data-tab="store"><i class="fa-solid fa-store"></i> Sklep</a></li>
                    <li><a href="#" data-tab="community"><i class="fa-solid fa-users"></i> Społeczność</a></li>
                    <li><a href="#" data-tab="settings"><i class="fa-solid fa-gear"></i> Ustawienia</a></li>
                </ul>
            </nav>
            <div class="download-manager">
                <div class="download-info">
                    <span>Pobieranie...</span>
                    <span>45%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress" style="width: 45%;"></div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="search-bar">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" placeholder="Szukaj gier, anime...">
                </div>
                <div class="user-profile">
                    <div class="notifications">
                        <i class="fa-regular fa-bell"></i>
                        <span class="badge">3</span>
                    </div>
                    <div class="avatar">
                        <img src="https://i.pravatar.cc/150?img=32" alt="User Avatar">
                    </div>
                    <div class="user-info">
                        <span class="username">OtakuMaster</span>
                        <span class="status">Online</span>
                    </div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="content-area" id="dynamic-content">
                <!-- Dynamic Content will be injected here by script.js -->
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
